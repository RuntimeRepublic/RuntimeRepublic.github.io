name: Suggest an improvement
description: Suggest a change to one section of the demo, with an optional picture.
title: "Suggestion: "
labels: ["suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the demo. This repository is **public**: anyone can see what you post here.
  - type: input
    id: section
    attributes:
      label: Which section?
      description: Filled in for you when you click "Suggest an improvement" on the demo.
      placeholder: "Taxes → Coffee at home → Rule of 72"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: textarea
    id: image
    attributes:
      label: Picture (optional)
      description: Drag a screenshot or photo here, or paste it with Ctrl+V.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: My picture and text have no personal information (no real dollar amounts, account numbers, names or faces).
          required: true
